experiment:
  name: "example_classification"
  description: "サンプル分類タスクのプロンプト最適化"

dataset:
  path: "data/example_dataset.jsonl"
  input_fields: ["text"]
  split:
    train: 0.7
    val: 0.15
    test: 0.15

module:
  path: "examples/simple_classifier.py"
  class_name: "SimpleClassifier"

lm:
  provider: "openai"
  model: "gpt-4o-mini"
  temperature: 1.0
  max_tokens: 16000

optimizer:
  name: "BootstrapFewShotWithRandomSearch"
  params:
    max_bootstrapped_demos: 4
    max_labeled_demos: 10
    num_candidate_programs: 8
    num_threads: 4

metric:
  name: "exact_match"
  field: "label"

observability:
  backend: "local"
